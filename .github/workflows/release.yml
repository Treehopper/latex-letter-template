name: Build letter
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: letter.tex
      - uses: softprops/action-gh-release@v2
        with:
          files: letter.pdf
